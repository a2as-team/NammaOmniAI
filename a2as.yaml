functions:
  __init__:
    type: sync
    module: agents.traffic-update-orchestrator.orca
    args: [self, name, road_block_agent, accident_agent, environment_agent]
  _client:
    type: sync
    module: agents.energy-management-orchestrator.tools
    args: [self]
    params:
      returns: genai.Client
  _main:
    type: async
    module: agents.energy-management-orchestrator.__main__
    params:
      returns: None
  _run_agent:
    type: async
    module: agents.traffic-update-orchestrator.orca
    args: [self, agent, ctx]
    params:
      returns: List[Event]
  _run_and_clean:
    type: async
    module: agents.energy-management-orchestrator.energy_coordinator
    args: [user_input]
    params:
      returns: EnergyDigestOutput
  _run_async_impl:
    type: async
    module: agents.traffic-update-orchestrator.orca
    args: [self, ctx]
    params:
      returns: AsyncGenerator
  _strip_fences:
    type: sync
    module: agents.energy-management-orchestrator.tools
    args: [text]
    params:
      returns: str
  ask_json:
    type: sync
    module: agents.energy-management-orchestrator.tools

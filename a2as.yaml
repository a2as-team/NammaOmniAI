  bbmp_agent:
    type: agent
    agents: [traffic_coordinator]
    params:
      wrapper: AgentTool
      agent: bbmp_agent
  bescom_agent:
    type: agent
    agents: [energy_coordinator]
    params:
      wrapper: AgentTool
      agent: bescom_agent
  btp_agent:
    type: agent
    agents: [traffic_coordinator]
    params:
      wrapper: AgentTool
      agent: btp_agent
  cultural_events_agent:
    type: agent
    agents: [event_coordinator]
    params:
      wrapper: AgentTool
      agent: cultural_events_agent
  google_search:
    type: module
    agents: [weather_agent, social_media_agent, bbmp_agent, btp_agent, bescom_agent, cultural_events_agent]
  social_media_agent:
    type: agent
    agents: [traffic_coordinator]
    params:
      wrapper: AgentTool
      agent: social_media_agent
  weather_agent:
    type: agent
    agents: [traffic_coordinator]
    params:
      wrapper: AgentTool
      agent: weather_agent

